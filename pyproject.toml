[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-streaming-schema-validator"
version = "0.1.0"
description = "Low-latency streaming JSON-RPC schema validator validating Model Context Protocol frames with zero buffer copies"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-streaming-schema-validator = "mcp_streaming_schema_validator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_streaming_schema_validator*"]
